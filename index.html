<!DOCTYPE html>
<html lang="fa" dir="rtl" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/emerald-life-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Emerald Life | مدیریت هوشمند زندگی و مطالعه در اندروید</title>
    <meta name="title" content="Emerald Life | سیستم جامع مدیریت زندگی و مطالعه" />
    <meta name="description" content="اپلیکیشن اختصاصی اندروید برای سازماندهی وظایف، ردیابی عادت‌ها، برنامه‌ریزی تقویم، تایمر متمرکز مطالعه و تحلیل بهره‌وری فردی با معماری امن و آفلاین." />
    <meta name="theme-color" content="#059669" />
    
    <!-- Inline Theme Bootstrap to eliminate flash of unstyled theme -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('sana_studio_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Emerald Life | مدیریت هوشمند زندگی و مطالعه در اندروید" />
    <meta property="og:description" content="سازماندهی وظایف، زنجیره عادت‌ها، تقویم زمانی، تایمر مطالعه و نمودارهای دقیق آماری در یک اپلیکیشن لوکال و امن برای اندروید." />
    <meta property="og:image" content="/assets/emerald-life-icon.png" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Emerald Life | مدیریت هوشمند زندگی و مطالعه" />
    <meta name="twitter:description" content="سازماندهی وظایف، زنجیره عادت‌ها، تقویم زمانی، تایمر مطالعه و نمودارهای دقیق آماری در یک اپلیکیشن لوکال و امن برای اندروید." />
    <meta name="twitter:image" content="/assets/emerald-life-icon.png" />

    <!-- Preload Local Vazirmatn Variable Font for Instant Rendering -->
    <link rel="preload" href="/fonts/Vazirmatn[wght].woff2" as="font" type="font/woff2" crossorigin>
  </head>
  <body class="bg-[#F8FAFC] dark:bg-[#0B1310] text-slate-900 dark:text-slate-100 transition-colors duration-200 antialiased selection:bg-emerald-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
