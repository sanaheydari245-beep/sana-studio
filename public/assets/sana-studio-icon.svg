<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Primary Electric Blue Gradient -->
    <linearGradient id="sanaBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F7EFF" />
      <stop offset="50%" stop-color="#3563F5" />
      <stop offset="100%" stop-color="#1942C8" />
    </linearGradient>

    <!-- Highlight Arc Gradient -->
    <linearGradient id="sanaAccentGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#3563F5" />
    </linearGradient>

    <!-- Subtle Glow Shadow -->
    <filter id="sanaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#3563F5" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Deep Midnight Blue Squircle Container -->
  <rect x="4" y="4" width="112" height="112" rx="28" fill="#101B3D" stroke="#3563F5" stroke-opacity="0.35" stroke-width="2" />

  <!-- Geometric Interlocking 'S' Ribbon -->
  <g filter="url(#sanaGlow)">
    <!-- Top Sweeping Terminal -->
    <path d="M78 30 C90 30, 96 38, 96 48 C96 60, 78 64, 60 66 C42 68, 24 72, 24 84 C24 96, 36 102, 52 102 C68 102, 84 94, 90 88" 
          fill="none" 
          stroke="url(#sanaBrandGrad)" 
          stroke-width="13" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Complementary Inward Curve -->
    <path d="M42 30 C30 30, 24 38, 24 48 C24 54, 30 58, 42 60" 
          fill="none" 
          stroke="url(#sanaAccentGrad)" 
          stroke-width="11" 
          stroke-linecap="round"/>
  </g>

  <!-- Core Precision Anchor Dot -->
  <circle cx="60" cy="66" r="4.5" fill="#FFFFFF" />
</svg>
